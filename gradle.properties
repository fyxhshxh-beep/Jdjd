org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- FriendCall configuration -------------------------------------------------
# Jitsi Meet Android SDK version. "11.+" follows the newest 11.x release; once
# you have a build that works for you, pin it to an exact version (e.g. 11.x.y)
# so builds are reproducible. Check the Jitsi Android SDK docs for the latest.
jitsiSdkVersion=11.+

# Jitsi server used for calls. The public meet.jit.si is fine for testing, but
# for real use host your own Jitsi or use JaaS (8x8) with authenticated rooms.
jitsiServerUrl=https://meet.jit.si
